<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Test</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="./dist/vue.css">
  <script src="./dist/index.js"></script>
</head>
<body>
  <div id="app">
    <h1>Button Component Test</h1>
    <ApronButton variant="primary">Primary Button</ApronButton>
    <ApronButton variant="secondary">Secondary Button</ApronButton>
    <ApronButton variant="default">Default Button</ApronButton>
  </div>

  <script>
    const { createApp } = Vue;
    const { Button } = ApronDesignVue;

    createApp({
      components: {
        ApronButton: Button
      }
    }).mount('#app');
  </script>
</body>
</html>
